# Tokenize the Strands Decider v19 training mix for GKA-primed-HQwen3-8B-Instruct, and label it with model 1's
# replay (the v19 recipe, step 3; see examples/decision/recipes.md). The anchor is the GKA model itself, on every
# row, and model 1 (trained with examples/decision/train/hqwen3_gka_8b/lora_v14.yaml) is the teacher on the
# multi-step rows.
# hmf preprocess examples/decision/tokenization/hqwen3_gka_8b/strands_v19_replay.yaml --shard_size 20000 --parallel_jobs 32
model_name_or_path: ./models/GKA-primed-HQwen3-8B-Instruct-Decision   # Only the tokenizer is loaded
stage: decision
dataset: strands_train_v5,strands_multistep_v14,strands_generated_v16,strands_generated_v18,strands_adequacy_hs2,strands_adequacy_gen
tokenized_path: ./data/tokenized/decision/hqwen3_gka_8b/strands_v19
cutoff_len: 4096                     # Longer prompts are dropped
val_size: 0.03                       # Held out per task (stratified), rendered without augmentation
seed: 0                              # Validation split and augmentations
mix_strategy: concat
preprocessing_num_workers: 32
preprocessing_batch_size: 1000
packing: false
streaming: false

### Decision prompts ###
decision_prompt_format: strands
decision_num_augmentations: 1        # Augmented copies of each row (option order, phrasing), one per training epoch
decision_shuffle_options: true       # noul and choice options
decision_reverse_score_prob: 0.5     # score rubrics are reversed instead of shuffled
decision_vary_instructions: true     # Sample among each row's phrasings of the question
decision_ordinal_smoothing: 0.1      # score targets put this much mass on neighboring levels
decision_force_bos: false            # Prepend BOS if the tokenizer does not add it

### Labeling ###
decision_label_folder: anchor-gka8b_teacher-replay-model1   # A folder name, not a path: <tokenized_path>/labels/<this>
decision_anchor_model: amazon/GKA-primed-HQwen3-8B-Instruct   # The base model the student was converted from
decision_teacher_model: ./models/GKA-primed-HQwen3-8B-Instruct-Decision   # The decision model model 1 was trained from
decision_teacher_adapter: ./models/GKA-primed-HQwen3-8B-Instruct-Decision/LoRA-strands-v14   # Model 1's adapter (its output_dir)
decision_teacher_datasets: strands_multistep_v14
