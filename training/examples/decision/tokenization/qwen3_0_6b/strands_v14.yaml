# Tokenize and label the Strands Decider v14 training mix for Qwen3-0.6B (the v19 recipe's model 1), with the
# anchor on every row and Qwen3.5-4B's answers on the multi-step rows, which Strands Decider ships
# 1. python scripts/strands_teacher_to_hmf.py \
#        --teacher data/strands-decider/synthetic/teacher_multistep_v14.jsonl \
#        --datasets strands_multistep_v14 --output data/decision/teachers/teacher_multistep_v14.hmf.jsonl
# 2. hmf preprocess examples/decision/tokenization/qwen3_0_6b/strands_v14.yaml --shard_size 20000 --parallel_jobs 8
model_name_or_path: ./models/Qwen3-0.6B-Base-Decision   # Only the tokenizer is loaded
stage: decision
dataset: strands_train_v5,strands_multistep_v14
tokenized_path: ./data/tokenized/decision/qwen3_0_6b/strands_v14
cutoff_len: 3072                     # Longer prompts are dropped
val_size: 0.03                       # Held out per task (stratified), rendered without augmentation
seed: 0                              # Validation split and augmentations
mix_strategy: concat
preprocessing_num_workers: 8
preprocessing_batch_size: 1000
packing: false
streaming: false

### Decision prompts ###
decision_prompt_format: strands
decision_num_augmentations: 1        # Augmented copies of each row (option order, phrasing), one per training epoch
decision_shuffle_options: true       # noul and choice options
decision_reverse_score_prob: 0.5     # score rubrics are reversed instead of shuffled
decision_vary_instructions: true     # Sample among each row's phrasings of the question
decision_ordinal_smoothing: 0.1      # score targets put this much mass on neighboring levels
decision_force_bos: false            # Prepend BOS if the tokenizer does not add it

### Labeling ###
# The student's own base model gives the anchor, reading the tokenized prompts, so it must share the student's
# tokenizer. Qwen3.5-4B's answers to the multi-step rows give the teacher targets, from Strands Decider's
# data/synthetic/teacher_multistep_v14.jsonl, converted to HMF's teacher file format (step 1 above). The answers
# are over each row's options, not over tokens, so they suit a student with another tokenizer.
decision_label_folder: anchor-qwen3-0.6b-base_teacher-qwen35-4b   # A folder name, not a path: <tokenized_path>/labels/<this>
decision_anchor_model: Qwen/Qwen3-0.6B-Base
decision_teacher_file: ./data/decision/teachers/teacher_multistep_v14.hmf.jsonl
decision_teacher_datasets: strands_multistep_v14
