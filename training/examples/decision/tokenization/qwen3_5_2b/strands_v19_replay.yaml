# Label the Strands Decider v19 training mix with model 1's replay (the v19 recipe, step 3; see
# examples/decision/recipes.md), with the anchor on every row, and model 1 (trained with
# examples/decision/train/qwen3_5_2b/lora_v14.yaml) as the teacher on the multi-step rows.
# hmf preprocess examples/decision/tokenization/qwen3_5_2b/strands_v19_replay.yaml --shard_size 20000 --parallel_jobs 32
# The tokenization keys are those of strands_v19.yaml, so if the v19 data is already tokenized at
# tokenized_path, only the labeling runs.
model_name_or_path: ./models/Qwen3.5-2B-Base-Decision   # Only the tokenizer is loaded
stage: decision
dataset: strands_train_v5,strands_multistep_v14,strands_generated_v16,strands_generated_v18,strands_adequacy_hs2,strands_adequacy_gen
tokenized_path: ./data/tokenized/decision/qwen3_5_2b/strands_v19
cutoff_len: 4096                     # Longer prompts are dropped
val_size: 0.03                       # Held out per task (stratified), rendered without augmentation
seed: 0                              # Validation split and augmentations
mix_strategy: concat
preprocessing_num_workers: 32
preprocessing_batch_size: 1000
packing: false
streaming: false

### Decision prompts ###
decision_prompt_format: strands
decision_num_augmentations: 1        # Augmented copies of each row (option order, phrasing), one per training epoch
decision_shuffle_options: true       # noul and choice options
decision_reverse_score_prob: 0.5     # score rubrics are reversed instead of shuffled
decision_vary_instructions: true     # Sample among each row's phrasings of the question
decision_ordinal_smoothing: 0.1      # score targets put this much mass on neighboring levels
decision_force_bos: false            # Prepend BOS if the tokenizer does not add it

### Labeling ###
decision_label_folder: anchor-qwen35-2b-base_teacher-replay-model1   # A folder name, not a path: <tokenized_path>/labels/<this>
decision_anchor_model: Qwen/Qwen3.5-2B-Base
decision_teacher_model: ./models/Qwen3.5-2B-Base-Decision                  # The decision model model 1 was trained from
decision_teacher_adapter: ./models/Qwen3.5-2B-Base-Decision/LoRA-strands-v14 # Model 1's LoRA adapter and head
decision_teacher_datasets: strands_multistep_v14
