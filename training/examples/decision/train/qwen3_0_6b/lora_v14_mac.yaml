# Train a Qwen3-0.6B-Base decision model with LoRA on a Mac (MLX), on the Strands Decider v14 mix, with the anchor
# and teacher terms. This is the v19 recipe's model 1 (see examples/decision/recipes.md)
# 1. hmf decision-init examples/decision/init/qwen3_0_6b/pointer.yaml
# 2. hmf preprocess examples/decision/tokenization/qwen3_0_6b/strands_v14.yaml --shard_size 20000 --parallel_jobs 8
#    (tokenizes, then labels with the anchor on every row and Qwen3.5-4B's shipped answers on the multi-step rows)
# 3. hmf train examples/decision/train/qwen3_0_6b/lora_v14_mac.yaml
# Needs HMF's mac extra (pip install -e ".[mac]"), which installs MLX and mlx-lm.
### Model ###
model_name_or_path: ./models/Qwen3-0.6B-Base-Decision

### Decision training ###
stage: decision
do_train: true
do_eval: true
finetuning_type: lora
decision_backend: mlx                # MLX on Apple silicon (see train/decision/mlx/)
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj   # Attention and MLP projections
# The pointer head trains in full alongside the adapter

### Dataset ###
dataset: strands_train_v5,strands_multistep_v14
tokenized_path: ./data/tokenized/decision/qwen3_0_6b/strands_v14
cutoff_len: 3072
train_sampling_strategy: group_by_length   # Batch prompts of similar length together (less padding)
decision_pad_to_multiple_of: null    # MLX gains nothing from fixed batch lengths (no padding is 26% faster than 256)

### Anchor and teacher terms ###
decision_label_folder: anchor-qwen3-0.6b-base_teacher-qwen35-4b   # A folder name, not a path: <tokenized_path>/labels/<this>
decision_anchor_kl_weight: 0.3       # KL(anchor || model), on the rows with an anchor (at most 9 options)
decision_teacher_kl_weight: 1.0      # KL(teacher || model), on the rows with a teacher (the multi-step rows)

### Training ###
num_train_epochs: 1.0                # One epoch per augmentation (decision_num_augmentations when tokenizing)
per_device_train_batch_size: 4
gradient_accumulation_steps: 8       # 32 rows per step, as the GPU recipe's 4 rows on each of 8 GPUs
learning_rate: 1.0e-4                # LoRA adapters
decision_head_lr: 1.0e-3             # The head starts from a random initialization, so it needs a bigger step
weight_decay: 0.01                   # Applies to the head's matrices only
lr_scheduler_type: cosine
warmup_ratio: 0.03
max_grad_norm: 1.0
adam_beta2: 0.95
seed: 0

### Precision & Performance ###
bf16: true                           # The pointer head always computes in float32
# Gradient checkpointing only for batches of more than 4,096 padded tokens (rows times length): the shorter ones
# fit without it, and the longest need it, which uses about 13 GB at most
decision_checkpoint_min_tokens: 4096

### Evaluation ###
per_device_eval_batch_size: 8
eval_strategy: steps
eval_steps: 500

### Output & Logging ###
output_dir: ./models/Qwen3-0.6B-Base-Decision/LoRA-strands-v14-mac
logging_steps: 20
save_steps: 500
plot_loss: true
overwrite_output_dir: false
report_to: none
