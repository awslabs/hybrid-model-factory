# Train model 2 of the v19 recipe (as train/qwen3_5_2b/lora_v19.yaml) with DeepSpeed ZeRO-3, which splits the
# model's weights, gradients, and optimizer state across the GPUs. A 2B model fits on one GPU without it; this
# config is an example for models that do not, and trains to the same quality (examples/decision/README.md,
# "What to Expect"). Steps 1 and 2 are those of train/qwen3_5_2b/lora_v19.yaml, then:
#   hmf train examples/decision/train/qwen3_5_2b/lora_v19_z3.yaml
# Under DeepSpeed, the head's weights are stored in bf16. The head still computes in float32, and the
# optimizer keeps float32 master weights.
### Model ###
model_name_or_path: ./models/Qwen3.5-2B-Base-Decision

### Decision training ###
stage: decision
do_train: true
do_eval: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
# Attention and MLP projections, plus Gated DeltaNet's, without which LoRA reaches only the full-attention layers
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj,in_proj_qkv,in_proj_z,in_proj_a,in_proj_b,out_proj
# The pointer head trains in full alongside the adapter

### Dataset ###
dataset: strands_train_v5,strands_multistep_v14,strands_generated_v16,strands_generated_v18,strands_adequacy_hs2,strands_adequacy_gen
tokenized_path: ./data/tokenized/decision/qwen3_5_2b/strands_v19
cutoff_len: 4096
dataloader_num_workers: 4
train_sampling_strategy: group_by_length   # Batch prompts of similar length together (less padding)
decision_pad_to_multiple_of: 256     # Few distinct batch lengths, so Gated DeltaNet's kernels compile only a few times

### Anchor and teacher terms ###
decision_label_folder: anchor-qwen35-2b-base_teacher-replay-model1   # A folder name, not a path: <tokenized_path>/labels/<this>
decision_anchor_kl_weight: 0.3       # KL(anchor || model), on the rows with an anchor (at most 9 options)
decision_teacher_kl_weight: 1.0      # KL(teacher || model), on the rows with a teacher (the multi-step rows, model 1's answers)

### Training ###
num_train_epochs: 1.0                # One epoch per augmentation (decision_num_augmentations when tokenizing)
per_device_train_batch_size: 4
gradient_accumulation_steps: 1       # Effective batch 32 on 8 GPUs
learning_rate: 1.0e-4                # LoRA adapters
decision_head_lr: 1.0e-3             # The head starts from a random initialization, so it needs a bigger step
weight_decay: 0.01                   # Applies to the head's matrices only
lr_scheduler_type: cosine
warmup_ratio: 0.03
max_grad_norm: 1.0
adam_beta2: 0.95
seed: 0

### Precision & Performance ###
bf16: true                           # The pointer head always computes in float32
deepspeed: examples/deepspeed/ds_z3_config.json
decision_checkpoint_min_tokens: 4096 # Gradient checkpointing for long batches only (the multi-step documents)

### Evaluation ###
per_device_eval_batch_size: 8
eval_strategy: steps
eval_steps: 500

### Output & Logging ###
output_dir: ./models/Qwen3.5-2B-Base-Decision/LoRA-strands-v19-z3
logging_steps: 20
save_steps: 500
plot_loss: true
overwrite_output_dir: false
report_to: none
